[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.18.0"

# Content-hashed build output — Astro/Vite fingerprint every filename on
# content change, so these can be cached forever with zero staleness risk;
# a new deploy simply produces new filenames instead of overwriting old ones.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers plus a Report-Only CSP. Report-Only first so any
# accidental breakage (missed inline script, a third-party origin not yet
# listed) shows up in the browser console instead of silently breaking the
# site — flip Content-Security-Policy-Report-Only to Content-Security-Policy
# once a deploy or two comes back clean. frame-src carries the two actual
# playable game embeds (src/data/projects.ts's playableEmbedUrl values) —
# frame-ancestors is the separate, unrelated control for who may iframe this
# site itself (nobody currently does). HSTS is intentionally omitted here;
# Netlify already applies it site-wide.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://whenbunniesattack.netlify.app https://snackattackgame.netlify.app; frame-ancestors 'self'; base-uri 'self'"
